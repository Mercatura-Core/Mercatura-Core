name: Bug report
description: Submit a technical bug report for Mercatura Core.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        ## Mercatura Core technical issues

        This issue tracker is for reproducible technical issues affecting Mercatura Core.

        **Do not report security vulnerabilities through this public issue form.**
        For security-sensitive issues, follow the private reporting instructions in `SECURITY.md` and use GitHub's **Security → Report a vulnerability** feature.

        General questions, support requests, and community discussion should use the appropriate Mercatura community channels rather than the bug tracker.

        If a node is unexpectedly failing during synchronization or reporting data-corruption errors, please also rule out unstable hardware where practical.

        ----

  - type: checkboxes
    attributes:
      label: Is there an existing issue for this?
      description: Please search existing issues before submitting a new report.
      options:
        - label: I have searched the existing issues
          required: true

  - type: textarea
    id: current-behaviour
    attributes:
      label: Current behavior
      description: Describe what went wrong.
    validations:
      required: true

  - type: textarea
    id: expected-behaviour
    attributes:
      label: Expected behavior
      description: Describe what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to reproduce
      description: |
        Explain how to reproduce the issue. Include relevant configuration and actions taken.

        Screenshots may be attached when useful.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: |
        Paste relevant log output or attach the applicable debug log.

        See `doc/files.md` for information about Mercatura data-directory locations.

        Review logs before posting them publicly. Logs may contain IP addresses, paths, wallet information, or other identifying information.
    validations:
      required: false

  - type: dropdown
    id: installation-method
    attributes:
      label: How did you obtain Mercatura Core?
      multiple: false
      options:
        - Compiled from source
        - Official pre-built binaries
        - Package manager
        - Other
    validations:
      required: true

  - type: input
    id: core-version
    attributes:
      label: What version of Mercatura Core are you using?
      description: Run `mercaturad --version` or use `Help > About Mercatura Core` in the Qt application.
      placeholder: e.g. v0.1.0 or v0.1@abcdef0
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system and version
      placeholder: e.g. "Windows 11", "Ubuntu 22.04 LTS", or "macOS"
    validations:
      required: true

  - type: textarea
    id: machine-specs
    attributes:
      label: Machine specifications
      description: |
        Include relevant host specifications where useful:
        CPU, RAM, storage type, network connectivity, virtualization environment, etc.
    validations:
      required: false