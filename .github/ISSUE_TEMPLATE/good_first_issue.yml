name: Good First Issue
description: Suggest a task suitable for a new Mercatura contributor.
labels: [good first issue]
body:
  - type: markdown
    attributes:
      value: |
        A good first issue should be reasonably self-contained, well understood, and suitable for someone becoming familiar with the Mercatura codebase.

        Please describe both the motivation and a reasonable implementation direction.

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Explain why this change would improve Mercatura.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Possible solution
      description: Describe a possible implementation approach.
    validations:
      required: false

  - type: textarea
    id: useful-skills
    attributes:
      label: Useful skills
      description: Describe knowledge that would help a contributor complete this task.
      value: |
        * Compiling Mercatura Core from source
        * Running the C++ unit tests and Python functional tests
        * Familiarity with the relevant Mercatura subsystem
        * ...

  - type: textarea
    attributes:
      label: Guidance for new contributors
      description: This guidance will be shown to contributors considering the issue.
      value: |
        Want to work on this issue?

        Review the contributing guidance in the Mercatura README before beginning. If the implementation direction is unclear, discuss the approach on the issue before making a large change.